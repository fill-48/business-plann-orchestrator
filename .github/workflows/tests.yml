name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke tests (bash runner)
        shell: bash
        run: bash tests/run-tests.sh --smoke

      - name: Smoke tests (PowerShell runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File tests/run-tests.ps1 -Suite smoke

      - name: Integration tests
        shell: bash
        run: bash tests/run-tests.sh --integration

      - name: Working tree unchanged by the tests
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
